<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Riyad's Town</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #3a3a2a; touch-action: manipulation; overflow: hidden; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: sans-serif; }
        canvas { display: block; max-width: 100vw; max-height: 100vh; }
        #ui { position: absolute; top: 0; left: 0; width: 100%; padding: 10px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; z-index: 10; }
        .panel { background: rgba(0,0,0,0.7); color: #f0d9a0; padding: 8px 12px; border-radius: 12px; font-size: 14px; display: flex; align-items: center; gap: 10px; pointer-events: auto; flex-wrap: wrap; }
        .panel button { background: #8b7d3c; border: none; color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 14px; }
        .resource { display: flex; gap: 4px; align-items: center; }
        .mode-btn { background: #5a4e2f; }
        .mode-btn.active { background: #c7a44b; color: #000; }
    </style>
</head>
<body>
    <div id="ui">
        <div class="panel" style="justify-content: space-between;">
            <span id="resources">🌲0 🪨0 🪙0</span>
            <div style="display:flex; gap:6px;">
                <button id="buildModeBtn" class="mode-btn active">🏗️ Build</button>
                <button id="exploreModeBtn" class="mode-btn">🚶 Explore</button>
                <button id="saveBtn">💾</button>
            </div>
        </div>
        <div class="panel" id="questPanel" style="flex-direction: column; align-items: flex-start; max-width: 220px;">
            <strong>📜 Quests</strong>
            <span id="questText">No active quest</span>
        </div>
        <div class="panel" id="interactPanel" style="display: none; pointer-events: auto;">
            <span id="interactText"></span>
            <button id="interactBtn">Talk</button>
            <button id="closeInteractBtn">X</button>
        </div>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            // ----- Game State -----
            const GRID_SIZE = 20;           // 20x20 grid
            const TILE_WIDTH = 64;
            const TILE_HEIGHT = 32;
            const grid = [];               // 2D array: each cell = { type: 0(empty) or 1(built), color: 'brown'|'blue'|'red'|'white' }
            const NPCs = [];               // { x, y, name, questId? }
            let player = { x: 10, y: 10 }; // grid position
            let mode = 'build';            // 'build' or 'explore'
            let resources = { wood: 20, stone: 10, gold: 5 };
            let activeQuest = null;        // { description, reward, complete: ()=>bool }
            let selectedColor = 'brown';   // current building color (like the palette)
            let interactTarget = null;     // NPC or building reference for interaction

            // ----- Initialize Grid -----
            for (let y = 0; y < GRID_SIZE; y++) {
                grid[y] = [];
                for (let x = 0; x < GRID_SIZE; x++) {
                    grid[y][x] = { type: 0, color: null };
                }
            }

            // ----- Save/Load with localStorage -----
            function saveGame() {
                const data = {
                    grid: grid.map(row => row.map(cell => ({ type: cell.type, color: cell.color }))),
                    npcs: NPCs,
                    player,
                    resources,
                    activeQuest
                };
                localStorage.setItem('riyadstown_save', JSON.stringify(data));
                alert('Game saved!');
            }

            function loadGame() {
                const saved = localStorage.getItem('riyadstown_save');
                if (!saved) return;
                try {
                    const data = JSON.parse(saved);
                    for (let y = 0; y < GRID_SIZE; y++) {
                        for (let x = 0; x < GRID_SIZE; x++) {
                            grid[y][x] = data.grid[y][x] || { type: 0, color: null };
                        }
                    }
                    NPCs.length = 0;
                    data.npcs.forEach(n => NPCs.push(n));
                    player = data.player;
                    resources = data.resources;
                    activeQuest = data.activeQuest;
                    updateUI();
                } catch (e) { console.warn('Failed to load save'); }
            }

            // ----- Building Logic (Townscaper-like) -----
            function placeBuilding(gx, gy, color) {
                if (gx < 0 || gx >= GRID_SIZE || gy < 0 || gy >= GRID_SIZE) return false;
                if (grid[gy][gx].type !== 0) return false; // already built

                // cost
                if (color === 'blue' || color === 'red') {
                    if (resources.wood < 2 || resources.stone < 1) { alert('Need 2 wood & 1 stone for colored house'); return false; }
                    resources.wood -= 2;
                    resources.stone -= 1;
                } else {
                    if (resources.wood < 1) { alert('Need 1 wood'); return false; }
                    resources.wood -= 1;
                }

                grid[gy][gx] = { type: 1, color: color };
                // chance to spawn NPC if building near player or other buildings
                trySpawnNPC(gx, gy);
                updateUI();
                return true;
            }

            function trySpawnNPC(gx, gy) {
                // spawn human NPC after a few buildings
                const builtCount = grid.flat().filter(c => c.type === 1).length;
                if (builtCount >= 3 && NPCs.length < Math.floor(builtCount / 3) + 1) {
                    // find empty adjacent cell
                    const dirs = [[0,1],[1,0],[0,-1],[-1,0]];
                    for (let [dx, dy] of dirs) {
                        const nx = gx + dx, ny = gy + dy;
                        if (nx >= 0 && nx < GRID_SIZE && ny >= 0 && ny < GRID_SIZE && grid[ny][nx].type === 0) {
                            const name = ['Ali', 'Layla', 'Omar', 'Fatima', 'Yusuf'][Math.floor(Math.random() * 5)];
                            NPCs.push({ x: nx, y: ny, name, questId: Math.random() < 0.5 ? 'build' : 'collect' });
                            break;
                        }
                    }
                }
            }

            // ----- Quest system -----
            function generateQuest(npc) {
                if (npc.questId === 'build') {
                    activeQuest = {
                        description: `${npc.name}: "Build 3 more houses!"`,
                        progress: () => grid.flat().filter(c => c.type === 1).length,
                        goal: 3 + (grid.flat().filter(c => c.type === 1).length), // target 3 more than current
                        reward: { gold: 10 },
                        complete: false
                    };
                } else {
                    activeQuest = {
                        description: `${npc.name}: "Bring me 5 wood!" (Collect from trees or chests)`,
                        progress: () => resources.wood,
                        goal: 5,
                        reward: { gold: 15 },
                        complete: false
                    };
                }
                npc.questGiven = true;
                updateUI();
            }

            function checkQuestCompletion() {
                if (!activeQuest || activeQuest.complete) return;
                const current = activeQuest.progress();
                if (current >= activeQuest.goal) {
                    activeQuest.complete = true;
                    resources.gold += activeQuest.reward.gold;
                    alert('Quest completed! Reward: ' + activeQuest.reward.gold + ' gold');
                    activeQuest = null;
                    updateUI();
                }
            }

            // ----- Player movement (explore mode) -----
            function movePlayer(dx, dy) {
                const nx = player.x + dx, ny = player.y + dy;
                if (nx >= 0 && nx < GRID_SIZE && ny >= 0 && ny < GRID_SIZE) {
                    player.x = nx;
                    player.y = ny;
                    // interaction detection
                    interactTarget = null;
                    hideInteractPanel();
                    // check if adjacent to NPC?
                    checkInteractable();
                }
            }

            function checkInteractable() {
                if (mode !== 'explore') return;
                // NPC nearby (within 1 tile)
                for (let npc of NPCs) {
                    if (Math.abs(npc.x - player.x) <= 1 && Math.abs(npc.y - player.y) <= 1) {
                        interactTarget = npc;
                        showInteractPanel(`👤 ${npc.name}`);
                        return;
                    }
                }
                // check if standing on a building? (enter building not implemented, just talk)
                hideInteractPanel();
            }

            function showInteractPanel(text) {
                document.getElementById('interactPanel').style.display = 'flex';
                document.getElementById('interactText').textContent = text;
                document.getElementById('interactBtn').onclick = () => {
                    if (interactTarget && interactTarget.name) {
                        if (!interactTarget.questGiven && !activeQuest) {
                            generateQuest(interactTarget);
                            checkInteractable();
                        } else if (activeQuest) {
                            alert('Finish your current quest first!');
                        } else {
                            alert(`${interactTarget.name}: "Thank you for building this town!"`);
                        }
                    }
                };
                document.getElementById('closeInteractBtn').onclick = hideInteractPanel;
            }

            function hideInteractPanel() {
                document.getElementById('interactPanel').style.display = 'none';
                interactTarget = null;
            }

            // ----- UI Updates -----
            function updateUI() {
                document.getElementById('resources').innerHTML = `🌲${resources.wood} 🪨${resources.stone} 🪙${resources.gold}`;
                document.getElementById('questText').textContent = activeQuest ? activeQuest.description : 'No active quest';
                document.getElementById('buildModeBtn').classList.toggle('active', mode === 'build');
                document.getElementById('exploreModeBtn').classList.toggle('active', mode === 'explore');
            }

            // ----- Drawing (Isometric) -----
            function toScreen(gx, gy) {
                const ox = canvas.width / 2;
                const oy = canvas.height / 4;
                const sx = (gx - gy) * (TILE_WIDTH / 2);
                const sy = (gx + gy) * (TILE_HEIGHT / 2);
                return { x: ox + sx, y: oy + sy };
            }

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                // background
                ctx.fillStyle = '#6B8E23';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // draw grid tiles (ground)
                for (let y = 0; y < GRID_SIZE; y++) {
                    for (let x = 0; x < GRID_SIZE; x++) {
                        const pos = toScreen(x, y);
                        ctx.fillStyle = '#C2B280';
                        ctx.beginPath();
                        ctx.moveTo(pos.x, pos.y - TILE_HEIGHT / 2);
                        ctx.lineTo(pos.x + TILE_WIDTH / 2, pos.y);
                        ctx.lineTo(pos.x, pos.y + TILE_HEIGHT / 2);
                        ctx.lineTo(pos.x - TILE_WIDTH / 2, pos.y);
                        ctx.closePath();
                        ctx.fill();
                    }
                }

                // draw buildings
                for (let y = 0; y < GRID_SIZE; y++) {
                    for (let x = 0; x < GRID_SIZE; x++) {
                        if (grid[y][x].type === 1) {
                            const pos = toScreen(x, y);
                            const color = grid[y][x].color;
                            const roofColor = {
                                brown: '#8B4513',
                                blue: '#4682B4',
                                red: '#B22222',
                                white: '#FFFAF0'
                            }[color] || '#8B4513';
                            // simple house: wall + roof based on neighbors
                            const neighbors = countNeighbors(x, y);
                            const h = 20 + neighbors * 5; // height variation
                            // wall
                            ctx.fillStyle = '#D2B48C';
                            ctx.fillRect(pos.x - 12, pos.y - h - 10, 24, h + 10);
                            // roof
                            ctx.fillStyle = roofColor;
                            ctx.beginPath();
                            ctx.moveTo(pos.x - 16, pos.y - h - 10);
                            ctx.lineTo(pos.x, pos.y - h - 22 - neighbors * 2);
                            ctx.lineTo(pos.x + 16, pos.y - h - 10);
                            ctx.closePath();
                            ctx.fill();
                            // window
                            ctx.fillStyle = '#FFF';
                            ctx.fillRect(pos.x - 4, pos.y - h - 2, 8, 6);
                        }
                    }
                }

                // draw NPCs
                for (let npc of NPCs) {
                    const pos = toScreen(npc.x, npc.y);
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y - 10, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#FFD700';
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y - 12, 3, 0, Math.PI * 2);
                    ctx.fill();
                }

                // draw player in explore mode
                if (mode === 'explore') {
                    const pos = toScreen(player.x, player.y);
                    ctx.fillStyle = '#FFF';
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y - 12, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y - 14, 4, 0, Math.PI * 2);
                    ctx.fill();
                }

                // color palette buttons on canvas (bottom)
                drawPalette();
            }

            function countNeighbors(x, y) {
                let n = 0;
                if (y > 0 && grid[y-1][x].type === 1) n++;
                if (y < GRID_SIZE-1 && grid[y+1][x].type === 1) n++;
                if (x > 0 && grid[y][x-1].type === 1) n++;
                if (x < GRID_SIZE-1 && grid[y][x+1].type === 1) n++;
                return n;
            }

            function drawPalette() {
                const colors = ['brown', 'blue', 'red', 'white'];
                const startX = 30, startY = canvas.height - 50;
                for (let i = 0; i < colors.length; i++) {
                    const col = {
                        brown: '#8B4513',
                        blue: '#4682B4',
                        red: '#B22222',
                        white: '#FFFAF0'
                    }[colors[i]];
                    ctx.fillStyle = col;
                    ctx.fillRect(startX + i * 50, startY, 30, 30);
                    ctx.strokeStyle = selectedColor === colors[i] ? '#FFD700' : '#000';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(startX + i * 50, startY, 30, 30);
                }
            }

            // ----- Input Handling -----
            function handleCanvasClick(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const mx = (e.clientX - rect.left) * scaleX;
                const my = (e.clientY - rect.top) * scaleY;

                // palette detection
                const paletteY = canvas.height - 50;
                if (my > paletteY && my < paletteY + 30) {
                    const idx = Math.floor((mx - 30) / 50);
                    const colors = ['brown', 'blue', 'red', 'white'];
                    if (idx >= 0 && idx < colors.length) {
                        selectedColor = colors[idx];
                        updateUI();
                        draw();
                        return;
                    }
                }

                // grid click
                const tile = screenToGrid(mx, my);
                if (tile) {
                    if (mode === 'build') {
                        placeBuilding(tile.gx, tile.gy, selectedColor);
                        checkQuestCompletion();
                        draw();
                    } else if (mode === 'explore') {
                        // move player towards tile if adjacent? For simplicity, move one step towards click
                        const dx = Math.sign(tile.gx - player.x);
                        const dy = Math.sign(tile.gy - player.y);
                        movePlayer(dx, dy);
                        updateUI();
                        draw();
                    }
                }
            }

            function screenToGrid(sx, sy) {
                const ox = canvas.width / 2, oy = canvas.height / 4;
                // reverse isometric
                const relX = sx - ox, relY = sy - oy;
                const gx = (relX / (TILE_WIDTH/2) + relY / (TILE_HEIGHT/2)) / 2;
                const gy = (relY / (TILE_HEIGHT/2) - relX / (TILE_WIDTH/2)) / 2;
                const x = Math.round(gx), y = Math.round(gy);
                if (x >= 0 && x < GRID_SIZE && y >= 0 && y < GRID_SIZE) return { gx: x, gy: y };
                return null;
            }

            // ----- Mode Switches -----
            document.getElementById('buildModeBtn').addEventListener('click', () => {
                mode = 'build';
                hideInteractPanel();
                updateUI();
                draw();
            });
            document.getElementById('exploreModeBtn').addEventListener('click', () => {
                mode = 'explore';
                checkInteractable();
                updateUI();
                draw();
            });
            document.getElementById('saveBtn').addEventListener('click', saveGame);

            // ----- Canvas resize -----
            function resizeCanvas() {
                const maxW = window.innerWidth * 0.98;
                const maxH = window.innerHeight * 0.98;
                const aspect = 16/9;
                let w, h;
                if (maxW / maxH > aspect) {
                    h = maxH;
                    w = h * aspect;
                } else {
                    w = maxW;
                    h = w / aspect;
                }
                canvas.width = w;
                canvas.height = h;
                draw();
            }
            window.addEventListener('resize', resizeCanvas);
            canvas.addEventListener('click', handleCanvasClick);
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                handleCanvasClick(touch);
            }, {passive: false});

            // keyboard for testing
            window.addEventListener('keydown', (e) => {
                if (mode === 'explore') {
                    if (e.key === 'ArrowUp') movePlayer(0, -1);
                    if (e.key === 'ArrowDown') movePlayer(0, 1);
                    if (e.key === 'ArrowLeft') movePlayer(-1, 0);
                    if (e.key === 'ArrowRight') movePlayer(1, 0);
                    updateUI();
                    checkQuestCompletion();
                    draw();
                }
            });

            // initial load
            loadGame();
            resizeCanvas();
            updateUI();
        })();
    </script>
</body>
</html>
