<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="styles.css">
    <title>Riyad's Town</title>
</head>
<body>
    <div id="game-area">
        <h1>Welcome to Riyad's Town!</h1>

    <script src="game.js"></script>
</body>
</html>
